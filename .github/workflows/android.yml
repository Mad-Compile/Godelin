name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build Godelin debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Create temporary CI-only release key
        shell: bash
        run: |
          STORE_FILE="$RUNNER_TEMP/godelin-ci-validation.jks"
          keytool -genkeypair -noprompt -v \
            -keystore "$STORE_FILE" \
            -storetype JKS \
            -storepass "temporary-ci-only" \
            -keypass "temporary-ci-only" \
            -alias "godelin-ci-validation" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -dname "CN=Godelin CI Validation, O=Mad Compile, C=IN"
          chmod 600 "$STORE_FILE"
          echo "GODELIN_RELEASE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

      - name: Build and verify signed release APK
        env:
          GODELIN_RELEASE_STORE_PASSWORD: "temporary-ci-only"
          GODELIN_RELEASE_KEY_ALIAS: "godelin-ci-validation"
          GODELIN_RELEASE_KEY_PASSWORD: "temporary-ci-only"
        run: |
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary CI signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/godelin-ci-validation.jks"

      - name: Restore cached development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: godelin-development-debug-keystore-v1

      - name: Restore or create repository-backed development signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" cache
          if [ ! -f "$HOME/.android/debug.keystore" ] && [ -f cache/godelin-debug.keystore.b64 ]; then
            base64 --decode cache/godelin-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass "android" \
              -keypass "android" \
              -alias "androiddebugkey" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Mad Compile, C=IN"
          fi
          chmod 600 "$HOME/.android/debug.keystore"

          # Bootstrap the public development fallback once. This is intentionally
          # a disposable dev key; production signing must use a different identity.
          if [ ! -f cache/godelin-debug.keystore.b64 ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            base64 -w 0 "$HOME/.android/debug.keystore" > cache/godelin-debug.keystore.b64
            printf '\n' >> cache/godelin-debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cache/godelin-debug.keystore.b64
            git commit -m "Store development signing fallback [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Godelin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
